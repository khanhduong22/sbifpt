name: sbifpt

services:
  sbifpt-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sbifpt-api
    restart: unless-stopped
    environment:
      - PORT=4100
      - NODE_ENV=production
      - DATABASE_URL=file:/app/packages/db/prisma/dev.db
    expose:
      - "4100"
    ports:
      - "4100:4100"
    networks:
      - ops_bridge
    mem_limit: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  sbifpt-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sbifpt-web
    restart: unless-stopped
    expose:
      - "3100"
    ports:
      - "3100:3100"
    networks:
      - ops_bridge
    mem_limit: 128M
    depends_on:
      - sbifpt-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  ops_bridge:
    external: true
